<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Strip</title>
<style>
  :root {
    --bg: #0d0d0f; --panel: #17171b; --line: #2a2a31; --text: #ececf1; --dim: #8b8b96; --accent: #ff4f7b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  #status { font-size: 13px; color: var(--dim); }
  #status.on { color: #5fdc8f; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
  button {
    font: inherit; color: var(--text); background: #222228; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.active { outline: 2px solid var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .swatches button { aspect-ratio: 1; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .effects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 48px; border: none; border-radius: 12px; background: none; padding: 0; }
  #preview { display: flex; height: 18px; border-radius: 9px; overflow: hidden; }
  #preview span { flex: 1; }
  .disabled { opacity: 0.4; pointer-events: none; }
  #err { color: #ff8a8a; font-size: 14px; min-height: 1em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Strip</h1>
    <span id="status">Not connected</span>
  </header>

  <button id="connect" class="primary">Connect</button>
  <div id="err"></div>

  <div id="controls" class="disabled" style="display:grid;gap:14px">
    <section>
      <div class="row">
        <button id="on">On</button>
        <button id="off">Off</button>
      </div>
      <div id="preview"></div>
    </section>

    <section>
      <div class="label">Color</div>
      <input type="color" id="picker" value="#ff4f7b">
      <div class="swatches" id="swatches"></div>
    </section>

    <section>
      <div class="label">Brightness <span id="bval">80</span>%</div>
      <input type="range" id="bright" min="1" max="100" value="80">
    </section>

    <section>
      <div class="label">Effects</div>
      <div class="effects" id="effects"></div>
      <div class="label">Speed</div>
      <input type="range" id="speed" min="1" max="100" value="40">
    </section>
  </div>
</main>

<script>
const SERVICE = 0xffff, WRITE = 0xff01, NOTIFY = 0xff02;
const SEGMENTS = 20;

let writeChar = null, seq = 0;
let state = { mode: "solid", hsv: [343, 69, 100], bright: 80 };
let anim = null, t = 0, busy = false, pending = null;

const $ = id => document.getElementById(id);

// ---------- Protocol (IOTBT segment dialect) ----------
function wrap(cmd, family = 0x0B) {
  seq = (seq + 1) & 0xFF;
  const n = cmd.length;
  return new Uint8Array([0x00, seq, 0x80, 0x00, n >> 8, n & 0xFF, (n + 1) & 0xFF, family, ...cmd]);
}
function powerCmd(on) {
  const c = [0x3B, on ? 0x23 : 0x24, 0, 0, 0, 0, 0, 0, 0, 0x32, 0, 0];
  c.push(c.reduce((a, b) => a + b, 0) & 0xFF);
  return wrap(c);
}
function segmentsCmd(colors) {
  const n = colors.length, c = [0xE1, 0x03, 0x00, n, 0x00, 0x00, n];
  for (const [h, s, v] of colors) c.push(0xA1, Math.floor(((h % 360) + 360) % 360 / 2), Math.round(s), Math.max(1, Math.round(v)));
  return wrap(c);
}

// Only one write in flight. Newer frames replace older unsent ones.
async function send(bytes) {
  if (!writeChar) return;
  if (busy) { pending = bytes; return; }
  busy = true;
  try { await writeChar.writeValueWithoutResponse(bytes); }
  catch (e) { showErr(e.message); }
  busy = false;
  if (pending) { const p = pending; pending = null; send(p); }
}

// ---------- Color helpers ----------
function hexToHsv(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, max ? d / max * 100 : 0, max * 100];
}
const css = ([h, s, v]) => {
  const l = v / 100 * (1 - s / 200), sl = (l === 0 || l === 1) ? 0 : (v / 100 - l) / Math.min(l, 1 - l);
  return `hsl(${h} ${sl * 100}% ${l * 100}%)`;
};

// ---------- Frames ----------
const scale = (c, b) => c.map(([h, s, v]) => [h, s, v * b / 100]);
const EFFECTS = {
  rainbow: () => Array.from({ length: SEGMENTS }, (_, i) => [i * 360 / SEGMENTS, 100, 100]),
  flow:    k => Array.from({ length: SEGMENTS }, (_, i) => [(i * 360 / SEGMENTS + k * 6) % 360, 100, 100]),
  breathe: k => Array(SEGMENTS).fill([state.hsv[0], state.hsv[1], 15 + 85 * (0.5 + 0.5 * Math.sin(k / 6))]),
  chase:   k => Array.from({ length: SEGMENTS }, (_, i) => {
             const d = (i - k % SEGMENTS + SEGMENTS) % SEGMENTS;
             return [state.hsv[0], state.hsv[1], d < 4 ? 100 - d * 25 : 3];
           }),
  police:  k => Array.from({ length: SEGMENTS }, (_, i) => {
             const left = i < SEGMENTS / 2, phase = Math.floor(k / 3) % 2;
             return [left ? 0 : 230, 100, (left === !!phase) ? 100 : 2];
           }),
  sparkle: () => Array.from({ length: SEGMENTS }, () => Math.random() < 0.15 ? [state.hsv[0], 20, 100] : [state.hsv[0], state.hsv[1], 10]),
};
const ANIMATED = ["flow", "breathe", "chase", "police", "sparkle"];

function frame() {
  if (state.mode === "solid") return Array(SEGMENTS).fill(state.hsv);
  return EFFECTS[state.mode](t);
}
function render() {
  const colors = scale(frame(), state.bright);
  $("preview").innerHTML = colors.map(c => `<span style="background:${css([c[0], c[1], Math.max(c[2], 8)])}"></span>`).join("");
  send(segmentsCmd(colors));
}
function setMode(mode) {
  state.mode = mode;
  clearInterval(anim); anim = null;
  document.querySelectorAll("#effects button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  if (ANIMATED.includes(mode)) {
    const tick = () => { t++; render(); };
    anim = setInterval(tick, 1000 / (2 + +$("speed").value / 5));
  }
  render();
  save();
}

// ---------- Persistence ----------
function save() { try { localStorage.setItem("strip", JSON.stringify(state)); } catch {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem("strip")); if (s) state = { ...state, ...s }; } catch {}
  $("bright").value = state.bright; $("bval").textContent = state.bright;
}

// ---------- UI ----------
const showErr = m => $("err").textContent = m || "";
const SWATCHES = ["#ff0000", "#ff7a00", "#ffd400", "#00e05a", "#00c8ff", "#2a3cff", "#8a2bff", "#ff2bd6", "#ff4f7b", "#ffffff", "#ffb36b", "#00ffc8"];
$("swatches").innerHTML = SWATCHES.map(c => `<button style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join("");
$("effects").innerHTML = ["solid", "rainbow", ...ANIMATED].map(m => `<button data-mode="${m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join("");

$("swatches").onclick = e => { const c = e.target.dataset.c; if (!c) return; $("picker").value = c; state.hsv = hexToHsv(c); if (!ANIMATED.includes(state.mode) || state.mode === "flow") setMode("solid"); else render(); save(); };
$("picker").oninput = e => { state.hsv = hexToHsv(e.target.value); if (state.mode === "rainbow" || state.mode === "flow") setMode("solid"); else render(); save(); };
$("bright").oninput = e => { state.bright = +e.target.value; $("bval").textContent = state.bright; render(); save(); };
$("speed").oninput = () => { if (ANIMATED.includes(state.mode)) setMode(state.mode); };
$("effects").onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
$("on").onclick = async () => { await send(powerCmd(true)); setMode(state.mode); };
$("off").onclick = () => { clearInterval(anim); anim = null; send(powerCmd(false)); };

$("connect").onclick = async () => {
  showErr();
  if (!navigator.bluetooth) { showErr("This browser has no Bluetooth access. On iPhone, open this page in Bluefy."); return; }
  try {
    const device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "IOTBT" }], optionalServices: [SERVICE] });
    device.addEventListener("gattserverdisconnected", () => {
      writeChar = null; clearInterval(anim); anim = null;
      $("status").textContent = "Disconnected"; $("status").className = "";
      $("controls").classList.add("disabled"); $("connect").style.display = "";
    });
    $("status").textContent = "Connecting…";
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    writeChar = await svc.getCharacteristic(WRITE);
    try { const n = await svc.getCharacteristic(NOTIFY); await n.startNotifications(); } catch {}
    $("status").textContent = device.name; $("status").className = "on";
    $("controls").classList.remove("disabled"); $("connect").style.display = "none";
    await send(powerCmd(true));
    setMode(state.mode);
  } catch (e) {
    $("status").textContent = "Not connected";
    if (e.name !== "NotFoundError") showErr(e.message);
  }
};

load();
document.querySelectorAll("#effects button").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
$("preview").innerHTML = scale(frame(), state.bright).map(c => `<span style="background:${css([c[0], c[1], Math.max(c[2], 8)])}"></span>`).join("");
</script>
</body>
</html>
