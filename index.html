<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights</title>
<style>
  :root { --bg: #000; --text: #f2f2f2; --dim: #777; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 24px 16px; }
  #go { width: min(78vw, 300px); aspect-ratio: 1; border-radius: 50%; border: 2px solid #333;
    background: radial-gradient(circle, #1c1c1c, #0a0a0a); color: var(--text);
    font: 600 24px/1 inherit; letter-spacing: 0.02em; cursor: pointer; }
  #go:active { transform: scale(0.97); }
  #go.busy { border-color: #fff; box-shadow: 0 0 40px rgba(255,255,255,0.25); }
  #bar { display: flex; gap: 3px; width: min(78vw, 300px); height: 8px; }
  #bar span { flex: 1; border-radius: 2px; background: #1a1a1a; transition: background 0.1s; }
  #bar span.on { background: #fff; }
  #msg { color: var(--dim); font-size: 15px; text-align: center; max-width: 320px; min-height: 2.8em; }
  .row { display: flex; gap: 10px; }
  .row button { font: inherit; font-size: 15px; color: var(--text); background: #141414;
    border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 16px; }
</style>
</head>
<body>
<main>
  <button id="go">Light up</button>
  <div id="bar"></div>
  <div id="msg">Close ZENGGE first.</div>
  <div class="row">
    <button id="again">Replay</button>
    <button id="off">Off</button>
  </div>
</main>

<script>
// ---- Settings ----
const BRIGHTNESS = 50;     // percent, steady state and wipe
const SEGMENTS = 20;       // resolution of the wipe
const WIPE_MS = 2000;      // total wipe time
const REVERSE = false;     // flip if it fills back to front

const SERVICE = 0xffff, WRITE = 0xff01;
let ch = null, seq = 0, running = false;
const $ = id => document.getElementById(id);
const say = t => $("msg").textContent = t;
$("bar").innerHTML = "<span></span>".repeat(SEGMENTS);

function wrap(cmd) {
  seq = (seq + 1) & 0xFF;
  const n = cmd.length;
  return new Uint8Array([0x00, seq, 0x80, 0x00, n >> 8, n & 0xFF, (n + 1) & 0xFF, 0x0B, ...cmd]);
}
function power(on) {
  const c = [0x3B, on ? 0x23 : 0x24, 0, 0, 0, 0, 0, 0, 0, 0x32, 0, 0];
  c.push(c.reduce((a, b) => a + b, 0) & 0xFF);
  return wrap(c);
}
function frame(litSet) {
  const c = [0xE1, 0x03, 0x00, SEGMENTS, 0x00, 0x00, SEGMENTS];
  for (let i = 0; i < SEGMENTS; i++) c.push(0xA1, 0, 0, litSet.has(i) ? BRIGHTNESS : 1);
  return wrap(c);
}
// Wait for each write to be acknowledged so frames can't pile up and get dropped.
async function write(bytes) {
  if (ch.writeValueWithResponse) return ch.writeValueWithResponse(bytes);
  return ch.writeValue(bytes);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showBar(lit) {
  [...$("bar").children].forEach((s, i) => s.classList.toggle("on", lit.has(i)));
}

async function wipe() {
  if (!ch || running) return;
  running = true; $("go").classList.add("busy"); say("");
  try {
    await write(power(true));
    const order = [...Array(SEGMENTS).keys()];
    if (REVERSE) order.reverse();
    const lit = new Set();
    const step = WIPE_MS / SEGMENTS;
    for (const i of order) {
      const t0 = performance.now();
      lit.add(i);
      showBar(lit);
      await write(frame(lit));
      const left = step - (performance.now() - t0);
      if (left > 0) await sleep(left);
    }
    await write(frame(lit)); // final solid white, sent once more to be sure
    say("Lit. You can close this.");
  } catch (e) {
    say("Lost the connection: " + e.message);
  }
  running = false; $("go").classList.remove("busy");
}

async function attach(device) {
  device.addEventListener("gattserverdisconnected", () => { ch = null; say("Disconnected. Tap to reconnect."); });
  say("Connecting…");
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  ch = await svc.getCharacteristic(WRITE);
  await wipe();
}

async function pickAndGo() {
  if (ch) return wipe();
  if (!navigator.bluetooth) { say("No Bluetooth in this browser. Open this page in Bluefy."); return; }
  try {
    const device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "IOTBT" }], optionalServices: [SERVICE] });
    await attach(device);
  } catch (e) {
    if (e.name !== "NotFoundError") say(e.message);
  }
}

// Try to reconnect to a remembered controller with no tap. Falls back to the button.
async function autoStart() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  try {
    const known = (await navigator.bluetooth.getDevices()).find(d => (d.name || "").startsWith("IOTBT"));
    if (known) await attach(known);
  } catch { say("Tap Light up."); }
}

$("go").onclick = pickAndGo;
$("again").onclick = () => ch ? wipe() : pickAndGo();
$("off").onclick = async () => { if (ch) { await write(power(false)); showBar(new Set()); say("Off."); } };
autoStart();
</script>
</body>
</html>
