<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights</title>
<style>
  :root { --bg: #000; --text: #f2f2f2; --dim: #777; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 24px 16px; }
  #go { width: min(78vw, 300px); aspect-ratio: 1; border-radius: 50%; border: 2px solid #333;
    background: radial-gradient(circle, #1c1c1c, #0a0a0a); color: var(--text);
    font-family: inherit; font-size: 24px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer; }
  #go:active { transform: scale(0.97); }
  #go.busy { border-color: #fff; box-shadow: 0 0 40px rgba(255,255,255,0.25); }
  #track { width: min(78vw, 300px); height: 6px; border-radius: 3px; background: #1a1a1a; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #fff; }
  #msg { color: var(--dim); font-size: 15px; text-align: center; max-width: 320px; min-height: 2.8em; }
  .row { display: flex; gap: 10px; }
  .row button { font: inherit; font-size: 15px; color: var(--text); background: #141414;
    border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 16px; }
</style>
</head>
<body>
<main>
  <button id="go">Light up</button>
  <div id="track"><div id="fill"></div></div>
  <div id="msg">Loading… if this never changes, the script did not run.</div>
  <div class="row">
    <button id="again">Replay</button>
    <button id="off">Off</button>
  </div>
</main>

<script>
window.onerror = function (m, src, line) {
  var el = document.getElementById("msg");
  if (el) el.textContent = "Error: " + m + " (line " + line + ")";
};
</script>
<script>
// ---- Settings ----
const BRIGHTNESS = 50;   // percent, for the animations and the steady white
// Each step: [style number from the explorer, variant, seconds, speed 1-100]
const STEPS = [
  [18, 0, 7,   50],
  [9,  0, 0.8, 10],
];

// Explorer's style number -> the controller's style byte
const STYLES = [0x01,0x02,0x03,0x04,0x05,0x06,0x07,0x08,0x09,0x0A,0x0B,
                0x0C,0x0D,0x0E,0x0F,0x10,0x11,0x12,0x13,0x14,0x15,0x16,0x65,0x66];

const SERVICE = "0000ffff-0000-1000-8000-00805f9b34fb";
const WRITE = "0000ff01-0000-1000-8000-00805f9b34fb";
let ch = null, seq = 0, running = false;
const $ = id => document.getElementById(id);
const say = t => $("msg").textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function wrap(cmd) {
  seq = (seq + 1) & 0xFF;
  const n = cmd.length;
  const out = new Uint8Array(8 + n);
  out.set([0x00, seq, 0x80, 0x00, n >> 8, n & 0xFF, (n + 1) & 0xFF, 0x0B]);
  out.set(cmd, 8);
  return out;
}
function power(on) {
  const c = [0x3B, on ? 0x23 : 0x24, 0, 0, 0, 0, 0, 0, 0, 0x32, 0, 0];
  c.push(c.reduce((a, b) => a + b, 0) & 0xFF);
  return wrap(c);
}
function scene(index, variant, speed) {
  const palette = [[0x00, 0x00, BRIGHTNESS], [0x00, 0x00, 1]];
  const c = [0xE1, 0x01, 0x00, 0x64, STYLES[index - 1], variant, 0x01, 0x64,
             Math.max(1, Math.min(100, speed)), 0x00, 0xA1, 0x00, 0x00, 0x00, palette.length];
  for (const p of palette) c.push(0xA1, p[0], p[1], p[2]);
  return wrap(c);
}
function solidWhite(segments = 20) {
  const c = [0xE1, 0x03, 0x00, segments, 0x00, 0x00, segments];
  for (let i = 0; i < segments; i++) c.push(0xA1, 0, 0, BRIGHTNESS);
  return wrap(c);
}
function withTimeout(promise, ms, label) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(label + " timed out")), ms))]);
}
async function write(bytes) {
  const op = ch.writeValueWithResponse ? ch.writeValueWithResponse(bytes) : ch.writeValue(bytes);
  return withTimeout(op, 4000, "Write");
}
const errText = e => ((e && e.name) || "Error") + ": " + ((e && e.message) || "(no message)");

function progress(ms) {
  const fill = $("fill");
  fill.style.transition = "none"; fill.style.width = "0";
  fill.offsetWidth; // restart the bar
  fill.style.transition = `width ${ms}ms linear`; fill.style.width = "100%";
}

async function play() {
  if (!ch || running) return;
  running = true; $("go").classList.add("busy"); say("");
  try {
    await write(power(true));
    progress(STEPS.reduce((t, s) => t + s[2] * 1000, 0));
    for (const [index, variant, seconds, speed] of STEPS) {
      await write(scene(index, variant, speed));
      await sleep(seconds * 1000);
    }
    await write(solidWhite());
    say("Lit. You can close this.");
  } catch (e) {
    say("Failed while sending. " + errText(e));
  }
  running = false; $("go").classList.remove("busy");
}

async function attach(device) {
  device.addEventListener("gattserverdisconnected", () => { ch = null; say("Disconnected. Tap to reconnect."); });
  say("Connecting to " + (device.name || "device") + "…");
  const server = await withTimeout(device.gatt.connect(), 10000, "Connect");
  say("Connected. Finding service…");
  const svc = await withTimeout(server.getPrimaryService(SERVICE), 6000, "Service lookup");
  ch = await withTimeout(svc.getCharacteristic(WRITE), 6000, "Characteristic lookup");
  say("Ready. Playing…");
  await play();
}

async function pickAndGo() {
  if (ch) return play();
  if (!navigator.bluetooth) { say("No Bluetooth in this browser. Open this page in Bluefy."); return; }
  say("Opening device picker…");
  let device;
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "IOTBT" }], optionalServices: [SERVICE] });
  } catch (e) {
    if (e.name === "NotFoundError" && /cancel/i.test(e.message || "")) { say("Picker closed."); return; }
    // Some browsers reject the name filter. Fall back to showing every device.
    try {
      say("Filter failed (" + errText(e) + "). Showing all devices…");
      device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SERVICE] });
    } catch (e2) {
      say("Picker failed. " + errText(e2));
      return;
    }
  }
  try { await attach(device); }
  catch (e) { ch = null; say("Connection failed. " + errText(e)); }
}

// Reconnect to a remembered controller without a tap, if the browser allows it.
async function autoStart() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  try {
    const known = (await navigator.bluetooth.getDevices()).find(d => (d.name || "").startsWith("IOTBT"));
    if (known) await attach(known);
  } catch (e) { ch = null; say("Auto-connect failed, tap Light up. " + errText(e)); }
}

$("go").addEventListener("click", pickAndGo);
$("again").addEventListener("click", () => ch ? play() : pickAndGo());
$("off").addEventListener("click", async () => { if (ch) { await write(power(false)); $("fill").style.width = "0"; say("Off."); } });
say(navigator.bluetooth ? "Ready (v3). Close ZENGGE, then tap Light up." : "Ready (v3), but this browser has no Bluetooth.");
setTimeout(autoStart, 500);
</script>
</body>
</html>
